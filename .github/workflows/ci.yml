# CI/CD Pipeline
# Runs tests, linting, type checking, and security scans.
#
# Features:
#   - Standard quality checks (tests, linting, type checking)
#   - Security scanning (Bandit, pip-audit)
#   - Optional SonarCloud/Codecov integration
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

# Uses org-level reusable workflow
jobs:
  ci:
    name: CI Pipeline
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@8fbdb549a33a93520e7b431d8d9b8d5e9478674a  # main
    with:
      python-version: '3.12'
      coverage-threshold: 80
      source-directory: 'src'
      test-directory: 'tests'
      run-integration-tests: true
      run-security-tests: true
      fail-on-llm-tags: false
      no-build: false  # project uses hatchling build backend; uv must build the editable install

  # Top-level aggregator. Produces a check named just "CI Gate" (no workflow
  # prefix) so it matches the org ruleset's required_status_checks entry
  # `CI Gate`. The reusable's internal `CI Gate` job is still visible as
  # `CI Pipeline / CI Gate`, but the ruleset matches by exact check name
  # which requires this inline job.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: ''
      - name: Aggregate CI result
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "::error::CI pipeline did not succeed: ${{ needs.ci.result }}"
            exit 1
          fi
          echo "CI Gate: passed"
