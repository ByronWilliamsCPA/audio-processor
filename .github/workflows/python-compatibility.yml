# Python Compatibility Matrix Testing for Audio Processor
# Tests the project across multiple Python versions and operating systems.
#
# Uses org-level reusable workflow for consistency across projects.
name: Python Compatibility

"on":
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Weekly compatibility check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Uses org-level reusable workflow
jobs:
  compatibility:
    name: Python Compatibility Matrix
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@74c633acfdd5f707ab154fd59bd212c6df663dd6  # main
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      include-windows: true
      include-macos: true
      # Marker expressions like -m "not slow" are dropped here because they fail
      # to parse on Windows Git Bash (the quoted argument loses its quotes and
      # pytest sees "slow" as a positional path). The --ignore paths already
      # exclude the integration and load suites; slow tests would need their own
      # --ignore or marker handled via pyproject.toml addopts if reintroduced.
      test-command: 'pytest tests/ -v --tb=short -x --ignore=tests/integration --ignore=tests/load'
      timeout-minutes: 30
      fail-fast: false
      no-build: false  # project uses hatchling build backend; uv must build the editable install
