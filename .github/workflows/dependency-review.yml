# Dependency Review - Analyzes dependency changes in PRs
# CI-013: security-analysis.yml passes run-dependency-review: true to the org reusable.
# Review whether this standalone workflow duplicates that check.
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit
          # NOTE: tighten to block after 2026-06-30 (cross-workflow egress migration).
          # The dependency-review action queries the GitHub API for dependency
          # metadata. When flipping to block, uncomment:
          # allowed-endpoints: >
          #   api.github.com:443
          #   github.com:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # Allow common permissive and compatible licenses.
          # NOTE: Cannot use both allow-licenses and deny-licenses - using allow-list approach.
          # Composite license entries (added 2026-05-17 during lockfile refresh):
          #   - MIT-CMU: Pillow's MIT-style license (CMU variant)
          #   - LicenseRef-scancode-protobuf: Google protobuf upstream license, BSD-3-Clause compatible
          #   - ZPL-2.1: Zope Public License (BSD-style permissive), used by pytz
          #   - HPND-Markus-Kuhn: Historical Permission Notice and Disclaimer variant, used by wcwidth
          # Audio-preprocessing entries (added 2026-05-19 with Phase 1 preprocessing pipeline):
          #   - MPL-1.1: older MPL variant used by hypothesis (paired with MPL-2.0)
          #   - 0BSD: zero-clause BSD, used by numba
          #   - BSD-4-Clause: 4-clause BSD, used by numba
          #   - BSD-2-Clause-Views: 2-clause BSD variant, used by rq
          #   - Zlib: zlib license, permissive, used by numpy
          #   - LicenseRef-scancode-python-cwi: Python CWI license, BSD-style, used by numba
          #   - LicenseRef-scancode-secret-labs-2011: Secret Labs license, BSD-style, used by numba
          #   - LicenseRef-scancode-unicode: Unicode license, permissive, used by numba
          allow-licenses: MIT, MIT-CMU, Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, BSD-4-Clause, 0BSD, ISC, MPL-1.1, MPL-2.0, LGPL-2.1, LGPL-3.0, Python-2.0, Unlicense, CC0-1.0, GPL-3.0-or-later, ZPL-2.1, Zlib, HPND-Markus-Kuhn, LicenseRef-scancode-protobuf, LicenseRef-scancode-python-cwi, LicenseRef-scancode-secret-labs-2011, LicenseRef-scancode-unicode
          # Packages whose license metadata is not indexed by GitHub's dependency
          # API (action sees "no license"). These all have known permissive
          # licenses that would be allowed under allow-licenses if metadata was
          # present:
          #   - torch, lxml, silero-vad, onnxruntime, deepgram-sdk: BSD-3-Clause / MIT
          #   - protobuf: BSD-3-Clause (LicenseRef-scancode-protobuf upstream)
          #   - jaraco-functools, ruamel-yaml, ruamel-yaml-clib: MIT
          #   - mkdocs-git-revision-date-localized-plugin: MIT
          #   - nvidia-* CUDA stack: NVIDIA Software License Agreement (proprietary
          #     EULA, accepted as dependency of torch which is required for VAD)
          allow-dependencies-licenses: >-
            pkg:pypi/torch,
            pkg:pypi/lxml,
            pkg:pypi/silero-vad,
            pkg:pypi/onnxruntime,
            pkg:pypi/deepgram-sdk,
            pkg:pypi/protobuf,
            pkg:pypi/jaraco-functools,
            pkg:pypi/ruamel-yaml,
            pkg:pypi/ruamel-yaml-clib,
            pkg:pypi/mkdocs-git-revision-date-localized-plugin,
            pkg:pypi/nvidia-cublas-cu12,
            pkg:pypi/nvidia-cuda-cupti-cu12,
            pkg:pypi/nvidia-cuda-nvrtc-cu12,
            pkg:pypi/nvidia-cuda-runtime-cu12,
            pkg:pypi/nvidia-cudnn-cu12,
            pkg:pypi/nvidia-cufft-cu12,
            pkg:pypi/nvidia-cufile-cu12,
            pkg:pypi/nvidia-curand-cu12,
            pkg:pypi/nvidia-cusolver-cu12,
            pkg:pypi/nvidia-cusparse-cu12,
            pkg:pypi/nvidia-cusparselt-cu12,
            pkg:pypi/nvidia-nccl-cu12,
            pkg:pypi/nvidia-nvjitlink-cu12,
            pkg:pypi/nvidia-nvshmem-cu12,
            pkg:pypi/nvidia-nvtx-cu12
          # Comment on PR with findings
          comment-summary-in-pr: on-failure
