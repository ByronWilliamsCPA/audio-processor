---
# Security Analysis Workflow
# Runs security scans including Bandit, pip-audit, OSV-Scanner, and CodeQL.
#
# Features:
#   - Bandit static analysis for Python
#   - pip-audit and OSV-Scanner for dependency vulnerability scanning
#   - Weekly scheduled scans
name: Security Analysis

"on":
  merge_group:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# Uses org-level reusable workflow
jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@799ebd63e16aba0236ceded915f5c1cac20823b3  # main
    with:
      source-directory: 'src'
      python-version: '3.12'
      fail-on-high: true
      fail-on-medium: false
      run-codeql: true
      run-dependency-review: true
      run-bandit: true
      run-safety: false  # safety removed from deps; pip-audit covers vulnerability scanning
      run-osv: true
      no-build: false  # project uses hatchling build backend; uv must build the editable install

  # Bare "Security Gate Validation" context required by the org ruleset.
  # The reusable security workflow surfaces as
  # "Security Analysis / Security Gate Validation" (caller / reusable job),
  # which cannot match the bare ruleset context. This in-line aggregator
  # re-emits the bare context on pull_request and inside the merge queue.
  security-gate:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: ''
      - name: Aggregate security result
        run: |
          result="${{ needs.security.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Security Gate Validation: passed (result: $result)"
          else
            echo "::error::Security Gate Validation failed: $result"
            exit 1
          fi
