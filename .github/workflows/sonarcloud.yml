# Audio Processor - SonarCloud Analysis
# Continuous code quality and security analysis via org reusable workflow.
#
# SonarCloud Dashboard: https://sonarcloud.io/dashboard?id=ByronWilliamsCPA_audio_processor
# Documentation: https://docs.sonarsource.com/sonarqube-cloud/
#
# Note: This workflow requires the SONAR_TOKEN secret. When the token is not
# configured, the reusable workflow skips analysis cleanly (skip-if-no-token).

name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # Required for PR decoration relay to the reusable workflow

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@6bad2f898be1d387b8424e9deddefa519674cb19 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      python-version: '3.12'
      source-directory: 'src/audio_processor'
      sonar-organization: 'williaby'
      sonar-project-key: 'ByronWilliamsCPA_audio_processor'
      skip-if-no-token: true
      fail-on-quality-gate: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
