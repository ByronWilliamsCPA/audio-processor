# REUSE Compliance Check for Audio Processor
# Validates REUSE 3.0 specification compliance for license management
#
# REUSE helps with clear licensing by using SPDX headers
# Documentation: https://reuse.software/
name: REUSE Compliance

on:
  pull_request:
    paths:
      - "**/*"
      - "REUSE.toml"
      - "LICENSES/**"
      - ".github/workflows/reuse.yml"
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

# Uses org-level reusable workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE Compliance Check
    uses: ByronWilliamsCPA/.github/.github/workflows/python-reuse.yml@bc8fd8df68be7d268428fe45d52ff9eb422815f5  # main
    with:
      generate-spdx: true
      fail-on-missing: true
      artifact-retention-days: 90
