# REUSE Compliance Check for Audio Processor
# Validates REUSE 3.0 specification compliance for license management
#
# REUSE helps with clear licensing by using SPDX headers
# Documentation: https://reuse.software/
name: REUSE Compliance

on:
  pull_request:
    paths:
      - "**/*"
      - "REUSE.toml"
      - "LICENSES/**"
      - ".github/workflows/reuse.yml"
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

# Uses org-level reusable workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE Compliance Check
    uses: ByronWilliamsCPA/.github/.github/workflows/python-reuse.yml@8fbdb549a33a93520e7b431d8d9b8d5e9478674a  # main
    with:
      generate-spdx: true
      fail-on-missing: true
      artifact-retention-days: 90

  # Top-level aggregator. Produces a check named just "Check REUSE Compliance"
  # (no workflow prefix) so it matches the org ruleset's required_status_checks
  # entry `Check REUSE Compliance`. The reusable's internal job remains
  # visible as `REUSE Compliance Check / REUSE Compliance Check`.
  gate:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    needs: [reuse]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: ''
      - name: Aggregate REUSE result
        run: |
          if [ "${{ needs.reuse.result }}" != "success" ]; then
            echo "::error::REUSE compliance did not pass: ${{ needs.reuse.result }}"
            exit 1
          fi
          echo "Check REUSE Compliance: passed"
