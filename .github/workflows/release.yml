---
# Release Workflow
# Handles automated releases with semantic versioning or
# manual tag-based releases.
#
# Features:
#   - Semantic versioning (if enabled) or manual tag-based releases
#   - GitHub Release creation
#
# Notes:
#   - PyPI publishing is disabled (private repo; publish-to-pypi: false)
#   - Triggered by CI workflow completion, not direct push to main
name: Semantic Release

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release type (leave empty for auto)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
          - prerelease

# Prevent concurrent releases
concurrency:
  group: "release-${{ github.event.workflow_run.head_branch || github.ref_name }}"
  cancel-in-progress: false

permissions:
  contents: read

# Uses org-level reusable workflow
jobs:
  release:
    name: Release Pipeline
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
      github.event.workflow_run.conclusion == 'success'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-release.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c  # main
    with:
      python-version: '3.12'
      coverage-threshold: 80
      source-directory: 'src'
      semantic-release: true
      force-release: "${{ github.event.inputs.force_release || '' }}"
      publish-to-pypi: false
      pypi-package-name: 'audio-processor'
      run-tests: false
      skip-tests-reason: 'Tests run in upstream CI pipeline before this workflow fires'
      no-build: false  # project uses hatchling build backend; uv must build the editable install
    secrets: inherit  # pragma: allowlist secret
