# Docker Compose configuration for Audio Processor
# Development environment with FastAPI app, Redis queue, and ARQ worker

services:
  # =============================================================================
  # Application Service (FastAPI API Server)
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILD_ENV: ${ENVIRONMENT:-development}
    image: audio_processor:${VERSION:-latest}
    container_name: audio_processor-app
    command: ["uvicorn", "audio_processor.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # Core settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}

      # Redis connection
      REDIS_URL: redis://redis:6379/0

      # Deepgram API (required for transcription)
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-2}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-true}
      DEEPGRAM_SMART_FORMAT: ${DEEPGRAM_SMART_FORMAT:-true}
      DEEPGRAM_SUMMARIZE: ${DEEPGRAM_SUMMARIZE:-true}

      # Sentry (error tracking - optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-development}

    volumes:
      # Development: Mount source code for hot reload
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      # Temporary audio files for processing
      - audio-temp:/app/temp

    ports:
      - "${APP_PORT:-8000}:8000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    networks:
      - audio_processor-network

  # =============================================================================
  # Redis Service (Job Queue + Caching)
  # =============================================================================
  redis:
    # CAND-007: Pin by SHA for reproducible builds.
    # Run: docker inspect redis:7-alpine --format '{{index .RepoDigests 0}}'
    # then replace with: image: redis@sha256:<digest>  # redis:7-alpine
    image: redis:7-alpine
    container_name: audio_processor-redis
    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - audio_processor-network

  # =============================================================================
  # ARQ Worker Service (Background Job Processing)
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILD_ENV: ${ENVIRONMENT:-development}
    image: audio_processor:${VERSION:-latest}
    container_name: audio_processor-worker
    command: ["arq", "audio_processor.jobs.worker.WorkerSettings"]
    environment:
      # Core settings
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-false}

      # Redis connection
      REDIS_URL: redis://redis:6379/0

      # Deepgram API (required for transcription)
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-2}
      DEEPGRAM_DIARIZE: ${DEEPGRAM_DIARIZE:-true}
      DEEPGRAM_SMART_FORMAT: ${DEEPGRAM_SMART_FORMAT:-true}
      DEEPGRAM_SUMMARIZE: ${DEEPGRAM_SUMMARIZE:-true}

      # Sentry (error tracking - optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-development}

    volumes:
      # Development: Mount source code for hot reload
      - ./src:/app/src:ro
      # Temporary audio files for processing (shared with app)
      - audio-temp:/app/temp

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - audio_processor-network

# =============================================================================
# Volumes (Persistent Storage)
# =============================================================================
volumes:
  redis-data:
    driver: local
  audio-temp:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  audio_processor-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# =============================================================================
# Usage Instructions
# =============================================================================
# Development:
#   docker-compose up -d
#   docker-compose logs -f app
#   docker-compose logs -f worker
#   docker-compose exec app bash
#
# Rebuild after dependency changes:
#   docker-compose up -d --build
#
# View all logs:
#   docker-compose logs -f
#
# Scale workers:
#   docker-compose up -d --scale worker=3
#
# Stop services:
#   docker-compose down
#
# Clean up (including volumes):
#   docker-compose down -v
