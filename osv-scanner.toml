# interrogate/py dependency - CVE-2022-42969 (DISPUTED)
# ----------------------------------------------------------------------------
[[IgnoredVulns]]
id = "CVE-2022-42969"
reason = """
DISPUTED ReDoS vulnerability in py package (transitive dependency of interrogate).
Only affects Subversion repository path parsing, which this project does not use.
interrogate is a dev dependency for docstring coverage checking.
The py package is unmaintained but poses no security risk in this context.
See: https://nvd.nist.gov/vuln/detail/CVE-2022-42969
"""

[[IgnoredVulns]]
id = "PYSEC-2022-42969"
reason = """
Same as CVE-2022-42969 - DISPUTED ReDoS in py package via interrogate.
Dev dependency only, affects SVN parsing which is not used.
"""

[[IgnoredVulns]]
id = "PYSEC-2026-139"
reason = """
CVE-2026-4538 in torch 2.9.1. CVSS:3.1 AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H (7.8 HIGH, local-only).
No patched version exists upstream (PyTorch PR #176791 is open but unmerged; OSV marks
last_affected as 2.10.0 with no fixed version identified). torch enters via the [ml] extra
(direct) and the [audio] extra (transitive via silero-vad); the production Dockerfile runs
uv sync --frozen --no-dev with no --extra flags so neither extra is installed at runtime.
Exploitation requires a local attacker with a valid user account on the same machine,
not applicable to a containerised CI/CD or cloud deployment model. Documented in
docs/known-vulnerabilities.md with reassess-by 2026-07-26.
"""

[[IgnoredVulns]]
id = "GHSA-w596-4wvx-j9j6"
reason = """
GitHub Security Advisory for py ReDoS (same as CVE-2022-42969).
DISPUTED vulnerability affecting SVN path parsing.
interrogate (dev dependency) transitively requires py, but this project
does not interact with Subversion repositories.
"""

